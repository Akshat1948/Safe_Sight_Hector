version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: safesight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safesight
      POSTGRES_PASSWORD: safesight_dev
      POSTGRES_DB: safesight
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safesight -d safesight']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safesight-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  aiml:
    build:
      context: ./ai-ml
      dockerfile: Dockerfile
    container_name: safesight-aiml
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8000/ml/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
